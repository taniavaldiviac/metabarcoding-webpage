project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "!**/*.ipynb"   # ← ignora notebooks
    - "!**/*.py"      # ← ignora scripts Python

website:
  repo-url: https://github.com/taniavaldiviac/metabarcoding-webpage
  title: "Metabarcoding de comunidades de eucariontes"
  page-footer:
    left: "© Dra. Tania Valdivia Carrillo — Todos los derechos reservados"
    border: true
  navbar:
    background: primary
    foreground: light
    left:
      - href: sesiones.qmd
        text: Sesiones
      - text: Materiales
        menu:
          - href: 0b-linux-r-intro.qmd
            text: "Linux y R — Introducción"
          - href: 0-Conexion-clonacion.qmd
            text: "Conexión al servidor"
          - href: 1-qaqc-cutadapt.qmd
            text: "FastQC y Cutadapt"
          - text: "---"
          - href: 2-dada2QAQC.qmd
            text: "DADA2 — Visión general"
          - href: 2-dada2QAQC-Prep.qmd
            text: "DADA2 — Preparación"
          - href: 2-dada2QAQC-Filter.qmd
            text: "DADA2 — Filter and Trim"
          - href: 2-dada2QAQC-Error.qmd
            text: "DADA2 — Dereplicación e inferencia"
          - href: 2-dada2QAQC-Merge.qmd
            text: "DADA2 — Unión paired-end"
          - href: 2-dada2QAQC-Chimeras.qmd
            text: "DADA2 — Quimeras"
          - href: 2-dada2QAQC-Taxonomy.qmd
            text: "DADA2 — Asignación taxonómica"
          - text: "---"
          - href: 3-reporte.qmd
            text: "Reporte de análisis"
      - href: Referencias.qmd
        text: Referencias
    right:
      - icon: github
        href: https://github.com/taniavaldiviac/metabarcoding-webpage

format:
  html:
    theme: [litera, styles.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    lang: es
    code-fold: true
    code-tools: true
    highlight-style: github
    df-print: paged
    page-layout: full

execute:
  freeze: auto
  enabled: false
  
resources:
  - slides/*.pdf
