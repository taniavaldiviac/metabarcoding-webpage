project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "slides/*.qmd"
    - "!**/*.ipynb"   # ← ignora notebooks
    - "!**/*.py"      # ← ignora scripts Python

website:
  repo-url: https://github.com/taniavaldiviac/metabarcoding-webpage
  title: "Metabarcoding de comunidades de eucariontes"
  page-footer:
    left: "© Dra. Tania Valdivia Carrillo — Todos los derechos reservados"
    border: true
  navbar:
    background: primary
    foreground: light
    right:
      - href: sesiones.qmd
        text: Sesiones
      - href: Referencias.qmd
        text: Lecturas recomendadas
      - icon: github
        href: https://github.com/taniavaldiviac/metabarcoding-webpage
  sidebar:
    style: floating
    contents:
      - section: "Día 1"
        contents:
          - 0-Zoom.qmd
          - 0-Conexion.qmd
      - section: "Día 2"
        contents:
          - 0b-linux-r-intro.qmd
          - 0-Preparacion.qmd
          - 0-Clonacion.qmd
          - 0-FASTQ.qmd
          - 1-qaqc-cutadapt.qmd
          - 2-dada2QAQC.qmd
      - section: "Día 3"
        contents:
          - 2-dada2QAQC-Prep.qmd
          - 2-dada2QAQC-Error.qmd
          - 2-dada2QAQC-Merge.qmd
          - 2-dada2QAQC-Chimeras.qmd
          - 2-dada2QAQC-Taxonomy.qmd
      - section: "Día 4"
        contents:
          - 3-reporte.qmd
          - 3-reporte-v2.qmd
      - section: "Lecturas recomendadas"
        contents:
          - Referencias.qmd

format:
  html:
    theme: [litera, styles.scss]
    toc: false
    number-sections: false
    page-navigation: true
    lang: es
    code-fold: true
    highlight-style: github
    df-print: paged
    page-layout: full

execute:
  freeze: auto
  enabled: false
  
resources:
  - slides/*.pdf
